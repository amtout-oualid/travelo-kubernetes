spring.application.name=travelo_backend

# Database connection: values come from environment variables (12-factor app).
# The password has NO default: it is never stored in the source code or in the image.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://travelo-database:3306/travelo_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Allowed CORS origins (comma-separated patterns), configurable per environment
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://*.localhost,http://*.localhost:*,http://frontend.exam.local}
