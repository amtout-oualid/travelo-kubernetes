apiVersion: apps/v1
kind: Deployment
metadata:
  name: travelo-backend
  namespace: {{ .Release.Namespace }}
  labels:
    app: travelo-backend
    {{- include "travelo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: travelo-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: travelo-backend
        tier: backend
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      initContainers:
        - name: wait-for-database
          image: {{ .Values.images.waitForDatabase }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command:
            - sh
            - -c
            - until nc -z travelo-database 3306; do echo "waiting for MySQL"; sleep 3; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: backend
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: travelo-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: travelo-db-secret
                  key: SPRING_DATASOURCE_PASSWORD
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /api/hello
              port: 8080
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /api/hello
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/hello
              port: 8080
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: travelo-backend
  namespace: {{ .Release.Namespace }}
  labels:
    app: travelo-backend
    {{- include "travelo.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: travelo-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
