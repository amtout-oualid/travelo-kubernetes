apiVersion: v1
kind: ConfigMap
metadata:
  name: travelo-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "travelo.labels" . | nindent 4 }}
data:
  MYSQL_DATABASE: {{ .Values.database.name | quote }}
  SPRING_DATASOURCE_URL: "jdbc:mysql://travelo-database:3306/{{ .Values.database.name }}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
  SPRING_DATASOURCE_USERNAME: {{ .Values.database.user | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.backend.corsAllowedOrigins | quote }}
  BACKEND_URL: "http://travelo-backend.{{ .Release.Namespace }}.svc.cluster.local:8080"
