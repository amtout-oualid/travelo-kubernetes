apiVersion: apps/v1
kind: Deployment
metadata:
  name: travelo-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    app: travelo-frontend
    {{- include "travelo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: travelo-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: travelo-frontend
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.images.frontend.repository }}:{{ .Values.images.frontend.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: travelo-config
                  key: BACKEND_URL
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: travelo-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    app: travelo-frontend
    {{- include "travelo.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: travelo-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
