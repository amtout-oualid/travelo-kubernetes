{{- if .Values.rbac.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: travelo-viewer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "travelo.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: travelo-viewer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "travelo.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "configmaps", "persistentvolumeclaims", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: travelo-viewer-binding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "travelo.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: travelo-viewer
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: travelo-viewer
  apiGroup: rbac.authorization.k8s.io
{{- end }}
