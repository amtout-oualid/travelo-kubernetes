apiVersion: v1
kind: Secret
metadata:
  name: travelo-db-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "travelo.labels" . | nindent 4 }}
type: Opaque
data:
  MYSQL_ROOT_PASSWORD: {{ .Values.database.rootPassword | b64enc | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.database.rootPassword | b64enc | quote }}
