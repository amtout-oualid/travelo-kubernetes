apiVersion: v1
kind: ServiceAccount
metadata:
  name: travelo-viewer
  namespace: travelo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: travelo-operator
  namespace: travelo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: travelo-viewer
  namespace: travelo
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "configmaps", "persistentvolumeclaims", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: travelo-operator
  namespace: travelo
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "configmaps", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: travelo-viewer-binding
  namespace: travelo
subjects:
  - kind: ServiceAccount
    name: travelo-viewer
    namespace: travelo
roleRef:
  kind: Role
  name: travelo-viewer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: travelo-operator-binding
  namespace: travelo
subjects:
  - kind: ServiceAccount
    name: travelo-operator
    namespace: travelo
roleRef:
  kind: Role
  name: travelo-operator
  apiGroup: rbac.authorization.k8s.io
