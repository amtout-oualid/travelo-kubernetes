apiVersion: batch/v1
kind: Job
metadata:
  name: travelo-load-data
  namespace: travelo-operator
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: load-data
          image: oualidamtout/travelo-database:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef:
                  name: travelo-cluster-secret
                  key: rootPassword
          command:
            - sh
            - -c
            - |
              until mysql -h travelo-cluster -P 3306 -uroot -e "SELECT 1" > /dev/null 2>&1; do echo "waiting for the InnoDB cluster"; sleep 5; done
              mysql -h travelo-cluster -P 3306 -uroot -e "CREATE DATABASE IF NOT EXISTS travelo_db"
              mysql -h travelo-cluster -P 3306 -uroot travelo_db < /docker-entrypoint-initdb.d/init.sql
              mysql -h travelo-cluster -P 3306 -uroot -e "SELECT COUNT(*) AS flights FROM travelo_db.flight"
