apiVersion: v1
kind: ConfigMap
metadata:
  name: travelo-config
  namespace: travelo
data:
  MYSQL_DATABASE: travelo_db
  SPRING_DATASOURCE_URL: jdbc:mysql://travelo-cluster.travelo-operator.svc.cluster.local:3306/travelo_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
  SPRING_DATASOURCE_USERNAME: root
  CORS_ALLOWED_ORIGINS: http://travelo.localhost,http://*.localhost
  BACKEND_URL: http://travelo-backend.travelo.svc.cluster.local:8080
